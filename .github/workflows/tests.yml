name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run tests (offline, includes the passivity test)
        run: python -m pytest -q

      - name: CLI smoke test
        run: wp-security-forsure list

  render:
    # Passe de rendu : vrai Chromium (bac à sable actif) contre un faux leurre
    # servi en local. WPSF_REQUIRE_RENDER fait échouer le job au lieu
    # d'ignorer le test si Chromium ou son bac à sable manque.
    runs-on: ubuntu-24.04
    env:
      WPSF_REQUIRE_RENDER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,render]"
          python -m playwright install --with-deps chromium

      - name: Allow the Chromium sandbox (unprivileged user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Render pass against a local fake lure
        run: python -m pytest -q -m render -rs

# Cycle de support des branches de PHP, recopié de php.net.
#
# Lu par wp_security_forsure/scanner/checks/php_runtime.py. Une branche reçoit
# deux ans de support actif, puis deux ans de correctifs de sécurité
# seulement, puis atteint sa fin de vie (supported-versions.php).
# Mettre à jour cette table à chaque nouvelle branche ou fin de vie, avec la
# date de relevé dans as_of.
version: 1
as_of: "2026-11-24"
source:
  - https://www.php.net/supported-versions.php
  - https://www.php.net/eol.php

# Branches supportées : fin du support actif, fin des correctifs de sécurité.
supported:
  "8.6": {active_until: "2028-12-31", security_until: "2030-12-31"}
  "8.5": {active_until: "2027-12-31", security_until: "2029-12-31"}
  "8.4": {active_until: "2026-12-31", security_until: "2028-12-31"}
  "8.3": {active_until: "2025-12-31", security_until: "2027-12-31"}
  "8.2": {active_until: "2024-12-31", security_until: "2026-12-31"}

# Branches en fin de vie : date de fin de vie et dernière version publiée.
